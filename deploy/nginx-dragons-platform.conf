# /etc/nginx/sites-available/dragons-platform
# Mesmo formato dos sites que ja existem na VPS (ver axioma-dashboard).
# Depois de habilitar, rodar:
#   certbot --nginx -d 84-247-175-240.sslip.io
# O certbot reescreve este arquivo adicionando o bloco 443 e o redirect de 80.

server {
    server_name 84-247-175-240.sslip.io;

    location / {
        proxy_pass http://127.0.0.1:3020;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    listen 80;
}
