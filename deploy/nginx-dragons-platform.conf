# /etc/nginx/sites-available/dragonsprz.lat
#
# Mesmo formato dos sites que ja existem na VPS (ver axioma-dashboard). Este
# arquivo NAO e aplicado por nenhum deploy automatico — o workflow
# `.github/workflows/deploy.yml` so mexe em Docker. E um template de
# referencia; a copia viva fica em `/etc/nginx/sites-available/` e e ajustada
# a mao (ver `docs/deploy.md`).
#
# Depois de copiar/atualizar na VPS e habilitar o symlink:
#   sudo ln -s /etc/nginx/sites-available/dragonsprz.lat /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl reload nginx
#   sudo certbot --nginx -d dragonsprz.lat -d www.dragonsprz.lat
#
# O certbot reescreve a copia da VPS adicionando os blocos `listen 443 ssl`
# (com os caminhos do cert) e o redirect de 80 -> 443. Por isso o arquivo
# aqui fica na forma "pre-certbot".
#
# O host antigo por IP (`84-247-175-240.sslip.io`) continua num arquivo
# separado, com cert proprio gerido pelo certbot; sera aposentado (virar
# `return 301` para o dominio novo) depois que a migracao for validada.

# Dominio canonico — serve o painel (container em 127.0.0.1:3020).
server {
    server_name dragonsprz.lat;

    location / {
        proxy_pass http://127.0.0.1:3020;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    listen 80;
}

# www -> apex. O app usa CLIENT_ORIGIN=https://dragonsprz.lat (sem www) e o
# cookie de sessao e host-only, entao `www` nunca deve servir o app direto.
server {
    server_name www.dragonsprz.lat;
    return 301 https://dragonsprz.lat$request_uri;

    listen 80;
}
